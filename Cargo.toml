[workspace]
resolver = "3"
# Top-level crates are listed by name: a `crates/*` glob would also match
# `crates/modules`, which only groups the module crates and has no manifest.
members = ["crates/core", "crates/daemon", "crates/platform-windows", "crates/modules/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kemalasliyuksek/vagus"
# Vagus ships as an application; crates are not published (the `vagus` name on crates.io is taken, see ADR 0002).
publish = false

[workspace.dependencies]
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
vagus-core = { path = "crates/core" }
vagus-perf = { path = "crates/modules/perf" }
vagus-platform-windows = { path = "crates/platform-windows" }
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block must explain why it is sound (Win32 FFI lives in platform crates).
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
